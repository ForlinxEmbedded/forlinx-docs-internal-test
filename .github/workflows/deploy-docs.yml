name: Build and Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'platform/**/**/*.md' # 只在 Markdown 文件变动时触发
      - 'homepage/**/*.rst'   #  RST 文件 
      - 'platform/**/*.rst'
      - 'homepage/conf.py'     #  配置文件（conf.py）
      - 'platform/**/conf.py'
      - 'homepage/**/*.css'
  workflow_dispatch:
    
jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 授予写入权限，以便提交更改

    steps:
    # 1️⃣ Checkout 仓库
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # 获取所有历史，以便进行 diff

    # 2️⃣ 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3️⃣ 安装依赖
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install requests

    # 4️⃣ 获取本次 push 的变化 Markdown 文件
    - name: Detect changed Markdown files
      id: detect_md
      shell: bash
      run: |
        echo "::group::Detect changed .md files"
        changed=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '\.md$' || true)
        echo "Changed md files:"
        echo "$changed"
        echo "::endgroup::"

        # 将多行路径写入环境变量 CHANGED_MD_FILES
        if [[ -n "$changed" ]]; then
          echo "CHANGED_MD_FILES<<EOF" >> "$GITHUB_ENV"
          echo "$changed" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
        fi

    # 5️⃣ 处理变化的 Markdown 文件（抓取图片 + 路径修改）
    - name: Process changed Markdown files
      shell: bash
      run: |
          if [[ -z "$CHANGED_MD_FILES" ]]; then
            echo "No changed Markdown files."
            exit 0
          fi

          echo "Processing changed Markdown files..."
          # 逐行读取环境变量
          while IFS= read -r f; do
            # 忽略空行
            [[ -z "$f" ]] && continue
            if [ -f "$f" ]; then
              echo "📄 Processing $f"
              python ./scripts/process_md_images.py "$f"
            else
              echo "⚠️ File not found: $f"
            fi
          done <<< "$CHANGED_MD_FILES"

    # 6️⃣ 提交并推送更新（把下载的图片和修改后的 md 存回主分支）
    - name: Commit and push changes
      shell: bash
      run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update docs changes"
            git push origin main
          else
            echo "No changes to commit."
          fi

    # 7️⃣ 【双重注入 1/2】在 Sphinx 编译前，强行在所有子项目源目录下创建 _static 并把公共资源塞进去
    - name: Pre-inject common static files
      run: |
        if [ -d "common_static" ]; then
          for project in platform/*/*; do
            if [ -d "$project" ]; then
              mkdir -p "$project/_static"
              cp -rf common_static/* "$project/_static/"
              echo "✅ 已同步静态资源至源目录: $project/_static/"
            fi
          done
        else
          echo "⚠️ 未找到 common_static 文件夹"
        fi
          
    # 8️⃣ 构建 homepage（必选）
    - name: Build homepage
      run: |
        mkdir -p docs_build
        sphinx-build -b html ./homepage ./docs_build

    # 9️⃣ 构建 platform 子项目并在编译完成后实施二次暴力拷贝兜底
    - name: Build platform docs
      run: |
        for project in platform/*/*; do
          if [ -f "$project/conf.py" ]; then
            echo "Building $project ..."
            project_name=$(basename $(dirname "$project"))
            platform_name=$(basename "$project")
            outdir="docs_build/$project_name/$platform_name"
            mkdir -p "$outdir"
            
            # 1. 运行编译
            sphinx-build -b html "$project" "$outdir"
            
            # 2. 【双重注入 2/2】编译完后，不管 Sphinx 怎么过滤，直接用 Linux 强行覆盖打包出的输出目录
            mkdir -p "$outdir/_static"
            if [ -d "common_static" ]; then
              cp -rf common_static/* "$outdir/_static/"
              echo "🚀 编译后二次物理注入成功: $outdir/_static/"
            fi
          fi
        done
        
    # 🔟 部署到 GitHub Pages（发布到新仓库的 gh-pages 分支）
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs_build
        publish_branch: gh-pages